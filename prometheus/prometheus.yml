global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# One host, so `instance` carries no information — but it defaults to
# host:port, which means changing a port silently splits every raw series in
# two. Pin it to the job name in every job below.
scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:13390']
    relabel_configs: &pin_instance
      - target_label: instance
        replacement: rig

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:13310']
    relabel_configs: *pin_instance

  - job_name: process
    static_configs:
      - targets: ['127.0.0.1:13320']
    relabel_configs: *pin_instance

  - job_name: gpu
    static_configs:
      - targets: ['127.0.0.1:13330']
    relabel_configs: *pin_instance

  # smartctl re-reads the drives on its own interval; scraping it faster only
  # re-serves a cached sample.
  - job_name: smart
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['127.0.0.1:13340']
    relabel_configs: *pin_instance

  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:13350']
    relabel_configs: *pin_instance
    metric_relabel_configs:
      # cAdvisor's per-CPU and filesystem series dwarf everything else and
      # answer nothing this stack is for.
      - source_labels: [__name__]
        regex: 'container_(tasks_state|memory_failures_total|fs_(sector|io_time|io_current|read_seconds|write_seconds)_.*)'
        action: drop
      # Shorten the compose labels; nobody types the full form twice.
      - source_labels: [container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: 'container_label_com_docker_compose_(project|service)'
        action: labeldrop
