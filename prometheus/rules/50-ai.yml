# Layer 5 — AI coding harness spend. Keyed by `harness`, `model` and `project`.
#
# Every figure is API list value: what these tokens would have cost billed
# through the provider's API. A subscription pays a flat fee instead, so this
# is the value received rather than the money leaving the account. The two
# numbers answer different questions and neither replaces the other.
#
# The source counters come from tools/harness-exporter.py at 60s. A counter
# starts at everything already on disk, so `increase()` over a window that
# predates the exporter reports nothing — `rig ai daily` reads the ledger for
# that instead.

groups:

  - name: rig-ai
    interval: 60s
    rules:

      # --- money, cumulative ----------------------------------------------
      - record: rig:ai:cost_usd
        expr: sum(aiusage_cost_usd_total)

      - record: rig:ai:cost_usd:by_harness
        expr: sum by (harness) (aiusage_cost_usd_total)

      - record: rig:ai:cost_usd:by_model
        expr: sum by (harness, model) (aiusage_cost_usd_total)

      # Where the money actually goes. On a long agent session this is
      # dominated by cache_read: the window is re-sent on every request.
      - record: rig:ai:cost_usd:by_role
        expr: sum by (role) (aiusage_cost_usd_total)

      - record: rig:ai:cost_usd:by_project
        expr: sum by (harness, project) (aiusage_project_cost_usd_total)

      # Work sent to subagents is money nobody is watching directly.
      - record: rig:ai:cost_usd:by_kind
        expr: sum by (harness, kind) (aiusage_cost_usd_total)

      # --- money, rate -----------------------------------------------------
      # Dollars per hour of API list value. `rate` over 1h needs the exporter
      # to have been up for that hour; before then it reads low, not wrong.
      - record: rig:ai:burn_usd_per_hour
        expr: sum(rate(aiusage_cost_usd_total[1h])) * 3600

      - record: rig:ai:burn_usd_per_hour:by_harness
        expr: sum by (harness) (rate(aiusage_cost_usd_total[1h])) * 3600

      - record: rig:ai:burn_usd_per_hour:by_project
        expr: sum by (harness, project) (rate(aiusage_project_cost_usd_total[1h])) * 3600

      # An offset delta rather than increase(): these counters are recomputed
      # from the ledger on every read, so a value can move down — a reprice, or
      # a backfilled sample meeting a live one. increase() reads any decrease
      # as a reset and adds the whole counter back.
      - record: rig:ai:cost_usd:today
        expr: sum(aiusage_cost_usd_total) - sum(aiusage_cost_usd_total offset 24h)

      - record: rig:ai:cost_usd:week
        expr: sum(aiusage_cost_usd_total) - sum(aiusage_cost_usd_total offset 7d)

      # --- tokens -----------------------------------------------------------
      - record: rig:ai:tokens
        expr: sum(aiusage_tokens_total)

      - record: rig:ai:tokens:by_role
        expr: sum by (role) (aiusage_tokens_total)

      - record: rig:ai:tokens:by_harness
        expr: sum by (harness) (aiusage_tokens_total)

      - record: rig:ai:tokens_per_sec
        expr: sum by (harness, role) (rate(aiusage_tokens_total[15m]))

      - record: rig:ai:requests_per_hour
        expr: sum by (harness) (rate(aiusage_requests_total[1h])) * 3600

      # How much of the context is re-read rather than new. Above ~0.95 the
      # session is paying mostly to remember, not to think.
      - record: rig:ai:cache_read_share
        expr: |
          sum(aiusage_tokens_total{role="cache_read"})
          / clamp_min(sum(aiusage_tokens_total{role=~"input|cache_read|cache_write"}), 1)

      # Dollars per million tokens, blended over everything sent. Rises when
      # the cache lapses, because a rebuild bills the window at write rate.
      - record: rig:ai:usd_per_million_tokens
        expr: |
          sum(aiusage_cost_usd_total)
          / clamp_min(sum(aiusage_tokens_total{role!="reasoning"}) / 1e6, 1e-9)

      # --- subsidy ----------------------------------------------------------
      # What the harness itself claims, against list price. Only three of the
      # harnesses here report a cost at all, so this covers part of the total.
      - record: rig:ai:reported_cost_usd
        expr: sum(aiusage_reported_cost_usd_total)

      - record: rig:ai:subsidy_usd
        expr: |
          sum(aiusage_cost_usd_total
              and on (harness, provider, model, kind) aiusage_reported_cost_usd_total)
          - sum(aiusage_reported_cost_usd_total)

      # --- coverage ---------------------------------------------------------
      - record: rig:ai:unpriced_tokens
        expr: sum(aiusage_unpriced_tokens_total)

      - record: rig:ai:sessions_live
        expr: sum by (harness) (aiusage_sessions_live)

      - record: rig:ai:harnesses_reporting
        expr: count(aiusage_source_files > 0)

      - record: rig:ai:scan_age_seconds
        expr: time() - aiusage_scan_timestamp_seconds

      # Fraction of a subscription window consumed, and how long until it
      # resets. Read from the seller that meters the plan, not from the tokens
      # counted above — a plan is spent by every device the account signed in on.
      - record: rig:ai:limit_used_ratio
        expr: aiusage_rate_limit_used_ratio

      - record: rig:ai:limit_left_ratio
        expr: 1 - aiusage_rate_limit_used_ratio

      - record: rig:ai:limit_reset_in_seconds
        expr: clamp_min(aiusage_rate_limit_reset_timestamp_seconds - time(), 0)


  - name: rig-ai-alerts
    interval: 60s
    rules:

      - alert: RigAiExporterDown
        expr: up{job="harness"} == 0
        for: 10m
        labels: { severity: warning, domain: ai }
        annotations:
          summary: "harness exporter is not answering"
          diagnose: "docker compose logs harness-exporter; `rig ai doctor` explains what it reads."

      - alert: RigAiLedgerStale
        expr: rig:ai:scan_age_seconds > 900
        for: 10m
        labels: { severity: warning, domain: ai }
        annotations:
          summary: "harness usage has not been rescanned for {{ $value | humanizeDuration }}"
          diagnose: "The scan thread is stuck or a session file is unreadable. `rig ai doctor`."

      - alert: RigAiPricesStale
        expr: aiusage_prices_age_seconds > 30 * 86400
        for: 1h
        labels: { severity: info, domain: ai }
        annotations:
          summary: "the models.dev price catalogue is over a month old"
          diagnose: "The exporter refetches on its own; a month means no network. `rig ai prices --fetch`."

      - alert: RigAiSubscriptionWindowNearlyUsed
        expr: rig:ai:limit_used_ratio > 0.9
        for: 5m
        labels: { severity: warning, domain: ai }
        annotations:
          summary: "{{ $labels.harness }} has used {{ $value | humanizePercentage }} of its {{ $labels.window }} window"
          diagnose: "`rig ai limits` shows when it resets."

      # A number worth a look rather than a number worth an alarm: it fires on
      # a rate held for an hour, not on one expensive turn.
      - alert: RigAiBurnRateHigh
        expr: rig:ai:burn_usd_per_hour > 60
        for: 1h
        labels: { severity: info, domain: ai }
        annotations:
          summary: "AI list-price burn is ${{ $value | printf \"%.0f\" }}/hour"
          diagnose: "`rig ai --since 2h` names the project and the model."
