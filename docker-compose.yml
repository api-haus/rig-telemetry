name: rig-telemetry

# Host network throughout: the exporters need the host's real /proc, sensors
# and PCI devices anyway, and it leaves no container DNS to break on restart.
# Port assignments and their quirks: docs/runbook.md.

services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rig-prometheus
    network_mode: host
    restart: unless-stopped
    user: root
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${RETENTION_TIME:-2y}'
      - '--storage.tsdb.retention.size=${RETENTION_SIZE:-30GB}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.listen-address=127.0.0.1:13390'
      - '--query.max-samples=250000000'
    labels:
      org.label-schema.group: "rig-telemetry"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: rig-grafana
    network_mode: host
    restart: unless-stopped
    depends_on: [prometheus]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 13337
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    labels:
      org.label-schema.group: "rig-telemetry"

  # Host CPU, load, memory, disks, filesystems, network, PSI and every hwmon
  # sensor (k10temp, asusec water loop, nvme composite, spd5118 DIMMs).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: rig-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=127.0.0.1:13310'
      - '--collector.processes'          # procs_blocked: the D-state count that IS the load average
      - '--collector.systemd'
      - '--collector.interrupts'
      - '--collector.drm'
      - '--collector.ethtool'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|host/(dev|proc|sys|run))($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|fuse\.rclone|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    labels:
      org.label-schema.group: "rig-telemetry"

  # Per-process-group CPU, RSS, swap, IO and — the important one —
  # process state counts, so a load spike can be attributed to a named binary.
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: rig-process-exporter
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter:/config:ro
    command:
      - '--procfs=/host/proc'
      - '--config.path=/config/config.yml'
      - '--web.listen-address=127.0.0.1:13320'
    labels:
      org.label-schema.group: "rig-telemetry"

  # Who is on the link. The kernel counts bytes per interface and never per
  # process, so this reads each socket's own counters over netlink and maps
  # them back through /proc/<pid>/fd to the group process-exporter would name.
  # It pings the gateway beside that, because a full link is not slow: it is
  # queued, and only round-trip time under load says so. docs/network.md.
  net-exporter:
    image: python:3.14-alpine
    container_name: rig-net-exporter
    network_mode: host
    pid: host
    # Socket counters, other users' file descriptors and an ICMP socket are
    # all root's to read.
    privileged: true
    restart: unless-stopped
    environment:
      RIG_NET_PROCFS: /host/proc
      RIG_NET_ADDR: 127.0.0.1
      RIG_NET_PORT: "13370"
      RIG_NET_INTERVAL: "${RIG_NET_INTERVAL:-10}"
      RIG_NET_PING_INTERVAL: "${RIG_NET_PING_INTERVAL:-2}"
      # Empty means the default gateway and 1.1.1.1, found at start.
      RIG_NET_PING_TARGETS: "${RIG_NET_PING_TARGETS:-}"
      RIG_NET_TOP_PEERS: "${RIG_NET_TOP_PEERS:-40}"
      # What the line is sold as. Without them nothing knows when it is full.
      RIG_NET_DOWN_MBIT: "${RIG_NET_DOWN_MBIT:-}"
      RIG_NET_UP_MBIT: "${RIG_NET_UP_MBIT:-}"
    volumes:
      - ./tools:/tools:ro
      # The same group definitions process-exporter uses, so both name a
      # process identically and `rig:net:proc:*` joins `rig:proc:*`.
      - ./process-exporter:/config:ro
      - /proc:/host/proc:ro
    command: ["python3", "/tools/net-exporter.py"]
    labels:
      org.label-schema.group: "rig-telemetry"

  # GPU: utilisation, temperature, power draw, fan, clocks, VRAM, throttling.
  # No nvidia-container-toolkit on this host, so nvidia-smi and libnvidia-ml
  # are bind-mounted straight in.
  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: rig-nvidia-exporter
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    # NVIDIA_LIB_DIR is /usr/lib on Arch, /usr/lib/x86_64-linux-gnu on Debian
    # and Ubuntu. Set it in .env — see docs/adapting.md.
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib}/libnvidia-ml.so:/usr/lib/libnvidia-ml.so:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib}/libnvidia-ml.so.1:/usr/lib/libnvidia-ml.so.1:ro
    command:
      - '--web.listen-address=127.0.0.1:13330'
    labels:
      org.label-schema.group: "rig-telemetry"

  # NVMe SMART: wear, media errors, unsafe shutdowns, per-drive temperature.
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: rig-smartctl-exporter
    network_mode: host
    privileged: true
    user: root
    restart: unless-stopped
    volumes:
      - /dev:/dev:ro
    command:
      - '--smartctl.path=/usr/sbin/smartctl'
      - '--smartctl.interval=120s'
      - '--web.listen-address=127.0.0.1:13340'
    labels:
      org.label-schema.group: "rig-telemetry"

  # What the AI coding harnesses spent, read from the session files they each
  # write. $HOME is mounted read-only because the set of directories to watch
  # grows every time a new harness ships; the cache directory is shared with
  # the host so `rig ai` and this container read one ledger.
  harness-exporter:
    # 3.14 or later: dsh compresses its transcript and compression.zstd is what
    # reads it. On an older interpreter that one harness reads as unreadable.
    image: python:3.14-alpine
    container_name: rig-harness-exporter
    network_mode: host
    restart: unless-stopped
    user: "${RIG_UID:-1000}:${RIG_GID:-1000}"
    environment:
      RIG_AI_HOME: /host/home
      RIG_AI_CACHE: /var/lib/rig-ai
      RIG_AI_ADDR: 127.0.0.1
      RIG_AI_PORT: "13360"
      RIG_AI_INTERVAL: "${RIG_AI_INTERVAL:-60}"
      RIG_AI_TOP_PROJECTS: "${RIG_AI_TOP_PROJECTS:-80}"
    volumes:
      - ./tools:/tools:ro
      - ./share:/share:ro
      - ${RIG_AI_HOME:-${HOME}}:/host/home:ro
      - ${RIG_AI_CACHE:-${HOME}/.cache/rig-telemetry}:/var/lib/rig-ai
      # The ledger buckets by local day and `rig ai` on the host reads the same
      # rows, so both have to agree on where a day ends.
      - /etc/localtime:/etc/localtime:ro
    command: ["python3", "/tools/harness-exporter.py"]
    labels:
      org.label-schema.group: "rig-telemetry"

  # Container attribution, so a runaway build in Docker is not invisible.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: rig-cadvisor
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    command:
      - '--port=13350'
      - '--listen_ip=127.0.0.1'
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
      # Compose labels only. Storing every label explodes cardinality, but
      # without these a container cannot be traced back to the stack it
      # belongs to, which is the question actually being asked of it.
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
    labels:
      org.label-schema.group: "rig-telemetry"

volumes:
  prometheus_data: {}
  grafana_data: {}
